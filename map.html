<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蔬食地圖・清大福青 2026 蔬食月</title>
  <link rel="icon" href="./img/抱抱地球2.png" type="image/png">
  <link rel="stylesheet" href="./assets/style.css">
  <link rel="stylesheet" href="./assets/bwy2026.css?v=20261015">
  <script src="./assets/theme-sync.js?v=20261015"></script>
  <style>
    .map-wrap {
      max-width: 1050px;
      margin: 28px auto;
      padding: 0 20px;
      box-sizing: border-box;
      transition: all 0.25s ease;
    }
    /* 桌面螢幕（1200px ~ 1439px）：最大化寬度，同時避開右側 200px 固定 QR 側欄（right: 24px） */
    @media (min-width: 1200px) and (max-width: 1439px) {
      .map-wrap {
        max-width: calc(100vw - 275px);
        margin: 28px 0 28px 30px;
        padding: 0 10px 0 0;
      }
    }
    /* 超寬桌面螢幕（≥ 1440px）：加大寬度至 1100px 且置中，與右側 QR 側欄具備充裕安全間隔 */
    @media (min-width: 1440px) {
      .map-wrap {
        max-width: 1100px;
        margin: 32px auto;
      }
    }
    /* 中窄螢幕與手機（< 1200px）：QR 轉為右下角 FAB 按鈕，地圖自適應延展，底部留白避開 FAB */
    @media (max-width: 1199px) {
      .map-wrap {
        max-width: 100%;
        margin: 20px auto;
        padding: 0 16px 80px;
      }
    }
    .map-frame-card iframe {
      width: 100%;
      height: 560px;
      border: none;
      display: block;
    }
    .island-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding: 16px 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #e7f3f1 0%, #fffaf2 58%, #fbead8 100%);
      border: 1.5px solid #9ec5c1;
      box-shadow: 0 6px 20px rgba(44, 74, 71, 0.1);
    }
    .island-banner-info h2 {
      margin: 0 0 4px;
      font-size: 1.12rem;
      color: #223331;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .island-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      background: #2c4a47;
      color: #fffaf2;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .island-banner-info p {
      margin: 0;
      font-size: 0.9rem;
      color: #4a615e;
      line-height: 1.5;
    }
    .island-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #3d7d78, #2c4a47);
      color: #fffaf2 !important;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.94rem;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(44, 74, 71, 0.22);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .island-cta-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.07);
    }
    @media (max-width: 600px) {
      .map-frame-card iframe {
        height: 400px;
      }
      .map-hero {
        padding: 20px 16px 14px;
      }
      .map-hero h1 {
        font-size: 1.25rem;
      }
      .island-banner {
        padding: 14px 15px;
      }
      .island-cta-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="map-wrap">

        <p>從清華大學「簡冊立柱」校門主島出發，3D 微縮探索精選 TOP 10 推薦蔬食餐廳、即時營業狀態與尋味測驗。</p>
