<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蔬食地圖・清大福青 2026 蔬食月</title>
  <link rel="icon" href="./img/抱抱地球2.png" type="image/png">
  <link rel="stylesheet" href="./assets/style.css">
  <link rel="stylesheet" href="./assets/bwy2026.css">
  <style>
    .map-hero {
      background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
      color: white;
      padding: 28px 32px 20px;
      text-align: center;
    }
    .map-hero h1 {
      font-size: 1.55rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .map-hero p {
      font-size: 0.92rem;
      color: #c8e6c9;
    }
    .map-wrap {
      max-width: 1050px;
      margin: 28px auto;
      padding: 0 20px;
      box-sizing: border-box;
      transition: all 0.25s ease;
    }
    /* 桌面螢幕（1200px ~ 1439px）：最大化寬度，同時避開右側 200px 固定 QR 側欄（right: 24px） */
    @media (min-width: 1200px) and (max-width: 1439px) {
      .map-wrap {
        max-width: calc(100vw - 275px);
        margin: 28px 0 28px 30px;
        padding: 0 10px 0 0;
      }
    }
    /* 超寬桌面螢幕（≥ 1440px）：加大寬度至 1100px 且置中，與右側 QR 側欄具備充裕安全間隔 */
    @media (min-width: 1440px) {
      .map-wrap {
        max-width: 1100px;
        margin: 32px auto;
      }
    }
    /* 中窄螢幕與手機（< 1200px）：QR 轉為右下角 FAB 按鈕，地圖自適應延展，底部留白避開 FAB */
    @media (max-width: 1199px) {
      .map-wrap {
        max-width: 100%;
        margin: 20px auto;
        padding: 0 16px 80px;
      }
    }
    .map-frame-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    .map-frame-card iframe {
      width: 100%;
      height: 560px;
      border: none;
      display: block;
    }
    .map-note {
      margin-top: 16px;
      font-size: 0.82rem;
      color: #607d8b;
      text-align: center;
      line-height: 1.6;
    }
    @media (max-width: 600px) {
      .map-frame-card iframe {
        height: 400px;
      }
      .map-hero {
        padding: 20px 16px 14px;
      }
      .map-hero h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <!-- 社群二維碼模組（獨立模組化引入，原生支援 file:// 與點擊事件，零遮擋） -->
  <script src="./assets/qr-fixed.js"></script>

  <!-- 頂部列 -->
  <header>
    <div class="brand">
      <span>🌱</span>
      <span>清大福青・2026 蔬食月</span>
    </div>
    <nav class="header-nav">
      <a href="index.html">🃏 賓果挑戰</a>
      <a href="map.html" class="nav-active">🗺️ 蔬食地圖</a>
      <a href="2025.html" target="_blank" rel="noopener">📖 2025 回顧</a>
    </nav>
    <div class="header-actions">
      <div class="lang-switch-wrap" title="切換語言 / Language">
        <span class="lang-btn active">繁中</span>
        <span class="lang-divider">|</span>
        <a href="index_en.html" class="lang-btn">English</a>
      </div>
    </div>
  </header>

  <div class="map-hero">
    <h1>🗺️ 新竹蔬食地圖</h1>
    <p>新竹縣市蔬食餐廳、素食推薦地點彙整</p>
  </div>

  <div class="map-wrap">
    <div class="map-frame-card">
      <iframe
        src="https://www.google.com/maps/d/u/1/embed?mid=1pRX1QdNBgRvGR4L5ckNvlSUIIl2OQDX0&ehbc=2E312F&z=14&ll=24.800807827244682%2C120.98678398824364"
        allowfullscreen
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>
    <p class="map-note">
      地圖資料由清大福青社行政組彙整維護・若有推薦地點歡迎私訊粉專或IG<br>
      點擊地圖標記可查看餐廳名稱與簡介
    </p>
  </div>

</body>
</html>
