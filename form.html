<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動報名・清大福青 2026 蔬食月</title>
  <link rel="icon" href="./img/抱抱地球2.png" type="image/png">
  <link rel="stylesheet" href="./assets/style.css">
  <link rel="stylesheet" href="./assets/bwy2026.css?v=20261015">
  <script src="./assets/theme-sync.js?v=20261015"></script>
  <style>
    .form-wrap {
      max-width: 680px;
      margin: 28px auto;
      padding: 0 16px;
      box-sizing: border-box;
      transition: all 0.25s ease;
    }
    /* 中窄螢幕與手機（< 1200px）：QR 轉為右下角 FAB 按鈕，表單自適應延展，底部留白避開 FAB */
    @media (max-width: 1199px) {
      .form-wrap {
        width: 100%;
        margin: 20px auto;
        padding: 0 16px 80px;
      }
    }
    .form-frame-card iframe {
      width: 100%;
      height: 3200px;
      border: none;
      display: block;
    }
    @media (max-width: 600px) {
      .form-frame-card iframe {
        height: 3600px;
      }
      .form-hero {
        padding: 20px 16px 14px;
      }
      .form-hero h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <!-- 社群二維碼模組（獨立模組化引入，原生支援 file:// 與點擊事件，零遮擋） -->
  <script src="./assets/qr-fixed.js"></script>

  <!-- 頂部列 -->
  <header>
    <div class="brand">
      <span>🌱</span>
      <span>清大福青・2026 蔬食月</span>
    </div>
    <nav class="header-nav">
      <a href="index.html">🃏 賓果挑戰</a>
      <a href="form.html" class="nav-active">📝 活動報名</a>
      <a href="map.html">🗺️ 蔬食地圖</a>
      <a href="2025.html" target="_blank" rel="noopener">📖 2025 回顧</a>
    </nav>
    <div class="header-actions">
      <div class="theme-switch-wrap" id="themeSwitchWrap" title="佈景主題 / Theme">
        <button type="button" class="theme-btn" id="btnThemeSimple" onclick="setTheme(1)">淡雅</button>
        <span class="theme-divider">|</span>
        <button type="button" class="theme-btn" id="btnThemeColorful" onclick="setTheme(2)">鮮豔</button>
      </div>
      <div class="lang-switch-wrap" title="切換語言 / Language">
        <span class="lang-btn active">繁中</span>
        <span class="lang-divider">|</span>
        <a href="index_en.html" class="lang-btn">English</a>
      </div>
    </div>
  </header>

  <div class="form-hero">
    <h1>📝 活動報名</h1>
    <p>2026 清大福青社蔬食月・特蔬任務系列活動線上報名</p>
  </div>

  <div class="form-wrap">
    <div class="form-frame-card">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfs-bQVfpW8DhumHevG0FUIStkvgyTsxUp6CfRqKtNlZHhgFQ/viewform?embedded=true" width="640" height="5868" frameborder="0" marginheight="0" marginwidth="0">載入中…</iframe>
    </div>
    <p class="form-note">
      若上方表單無法完整顯示，請點此 <a href="https://docs.google.com/forms/d/e/1FAIpQLSfs-bQVfpW8DhumHevG0FUIStkvgyTsxUp6CfRqKtNlZHhgFQ/viewform" target="_blank" rel="noopener">在新分頁開啟 Google 表單填寫</a><br>
      若有任何報名問題，歡迎私訊清大福智青年社 FB 粉專或 IG
    </p>
  </div>

</body>
</html>
